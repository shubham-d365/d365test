name: D365 Code Scanning

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:

  # ==========================================================
  # 1. Detect Changed Folders
  # ==========================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      solution: ${{ steps.filter.outputs.solution }}
      plugin: ${{ steps.filter.outputs.plugin }}
      masterdata: ${{ steps.filter.outputs.masterdata }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            solution:
              - 'solution/**'

            plugin:
              - 'pluginassamblies/**'

            masterdata:
              - 'masterdata/**'


  # ==========================================================
  # 2. Power Platform Solution Checker
  # ==========================================================
  solution-checker:
    name: Solution Checker
    needs: detect-changes

    if: needs.detect-changes.outputs.solution == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          Write-Host "Installing Power Platform CLI..."

          dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          $env:PATH += ":$HOME/.dotnet/tools"

          pac --version

      - name: Prepare Solution
        shell: pwsh
        run: |
          Write-Host "D365 Solution changes detected."

          $solutionPath = Join-Path $env:GITHUB_WORKSPACE "D365Solution"

          if (-not (Test-Path $solutionPath)) {
              Write-Error "D365Solution folder not found."
              exit 1
          }

          Write-Host "Solution path:"
          Write-Host $solutionPath

      # ------------------------------------------------------
      # Solution Checker
      # ------------------------------------------------------
      # NOTE:
      # Add your actual Solution Checker command/action here
      # according to your solution package structure.
      #
      # Example placeholder:
      # pac solution check --path <solution.zip>
      # ------------------------------------------------------

      - name: Run Solution Checker
        shell: pwsh
        run: |
          Write-Host "Running Power Platform Solution Checker..."

          # TODO:
          # Replace this with your actual Solution Checker command.

          Write-Host "Solution Checker completed."
          exit 0


  # ==========================================================
  # 3. C# CodeQL Scan
  # ==========================================================
  csharp-codeql:
    name: C# CodeQL Scan
    needs: detect-changes

    if: needs.detect-changes.outputs.plugin == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build C# Plugin
        shell: pwsh
        run: |
          Write-Host "D365 Plugin changes detected."

          $pluginPath = Join-Path $env:GITHUB_WORKSPACE "D365Plugin"

          if (-not (Test-Path $pluginPath)) {
              Write-Error "D365Plugin folder not found."
              exit 1
          }

          Set-Location $pluginPath

          Write-Host "Searching for solution/project files..."

          $solution = Get-ChildItem `
            -Path $pluginPath `
            -Filter "*.sln" `
            -Recurse |
            Select-Object -First 1

          if ($null -ne $solution) {

              Write-Host "Solution found:"
              Write-Host $solution.FullName

              dotnet restore $solution.FullName

              dotnet build `
                $solution.FullName `
                --configuration Release `
                --no-restore

          }
          else {

              $project = Get-ChildItem `
                -Path $pluginPath `
                -Filter "*.csproj" `
                -Recurse |
                Select-Object -First 1

              if ($null -eq $project) {
                  Write-Error "No .sln or .csproj file found in D365Plugin."
                  exit 1
              }

              Write-Host "Project found:"
              Write-Host $project.FullName

              dotnet restore $project.FullName

              dotnet build `
                $project.FullName `
                --configuration Release `
                --no-restore
          }

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ==========================================================
  # 4. MasterData - No Scan Required
  # ==========================================================
  masterdata-success:
    name: MasterData - No Scan Required
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.masterdata == 'true' &&
      needs.detect-changes.outputs.solution != 'true' &&
      needs.detect-changes.outputs.plugin != 'true'

    runs-on: ubuntu-latest

    steps:

      - name: MasterData Changes Detected
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "MasterData changes detected."
          Write-Host "No scanning is required."
          Write-Host "Marking pipeline as SUCCESS."
          Write-Host "=========================================="

          exit 0


  # ==========================================================
  # 5. Final Mandatory Check
  # ==========================================================
  scanning-result:
    name: Code Scanning Pipeline

    needs:
      - detect-changes
      - solution-checker
      - csharp-codeql
      - masterdata-success

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Evaluate Scan Results
        shell: pwsh
        run: |

          Write-Host "=========================================="
          Write-Host "D365 Code Scanning Pipeline"
          Write-Host "=========================================="

          Write-Host "Solution Checker : ${{ needs.solution-checker.result }}"
          Write-Host "C# CodeQL        : ${{ needs.csharp-codeql.result }}"
          Write-Host "MasterData       : ${{ needs.masterdata-success.result }}"

          # --------------------------------------------------
          # Solution Checker Result
          # --------------------------------------------------

          if ("${{ needs.solution-checker.result }}" -eq "failure") {
              Write-Error "Solution Checker FAILED."
              exit 1
          }

          # --------------------------------------------------
          # CodeQL Result
          # --------------------------------------------------

          if ("${{ needs.csharp-codeql.result }}" -eq "failure") {
              Write-Error "C# CodeQL Scan FAILED."
              exit 1
          }

          # --------------------------------------------------
          # No Scan / Skipped Jobs
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Applicable scans completed successfully."
          Write-Host "Code Scanning Pipeline = SUCCESS"
          Write-Host ""

          exit 0
