name: D365 Code Scanning

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:

  # ==========================================================
  # 1. Detect Changed Files
  # ==========================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      solution1: ${{ steps.filter.outputs.solution1 }}
      solution2: ${{ steps.filter.outputs.solution2 }}
      solution3: ${{ steps.filter.outputs.solution3 }}
      solution4: ${{ steps.filter.outputs.solution4 }}
      solution5: ${{ steps.filter.outputs.solution5 }}
      plugin: ${{ steps.filter.outputs.plugin }}
      masterdata: ${{ steps.filter.outputs.masterdata }}

    steps:

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |

            solution1:
              - 'solution/CRMLearning/**'

            solution2:
              - 'solution/common/**'

            solution3:
              - 'solution/solution2/**'

            solution4:
              - 'solution/solution3/**'

            solution5:
              - 'solution/solution4/**'

            plugin:
              - 'pluginassamblies/**'

            masterdata:
              - 'masterdata/**'


  # ==========================================================
  # 2. Solution Checker
  # ==========================================================
  solution-checker:
    name: Solution Checker
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.solution1 == 'true' ||
      needs.detect-changes.outputs.solution2 == 'true' ||
      needs.detect-changes.outputs.solution3 == 'true' ||
      needs.detect-changes.outputs.solution4 == 'true' ||
      needs.detect-changes.outputs.solution5 == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Install PAC CLI
      # ------------------------------------------------------
      - name: Install Power Platform CLI
        shell: pwsh
        run: |

          Write-Host "Installing Power Platform CLI..."

          dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          $env:PATH += ":$HOME/.dotnet/tools"

          pac --version


      # ------------------------------------------------------
      # Run Solution Checker
      # ------------------------------------------------------
      - name: Run Solution Checker
        shell: pwsh
        run: |

          $solutionRoot = Join-Path $env:GITHUB_WORKSPACE "D365Solution"

          $solutions = @(
              @{
                  Name = "Solution1"
                  Changed = "${{ needs.detect-changes.outputs.solution1 }}"
              },
              @{
                  Name = "Solution2"
                  Changed = "${{ needs.detect-changes.outputs.solution2 }}"
              },
              @{
                  Name = "Solution3"
                  Changed = "${{ needs.detect-changes.outputs.solution3 }}"
              },
              @{
                  Name = "Solution4"
                  Changed = "${{ needs.detect-changes.outputs.solution4 }}"
              },
              @{
                  Name = "Solution5"
                  Changed = "${{ needs.detect-changes.outputs.solution5 }}"
              }
          )

          $failed = $false

          foreach ($solution in $solutions) {

              if ($solution.Changed -ne "true") {
                  Write-Host "Skipping $($solution.Name) - no changes."
                  continue
              }

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "Running Solution Checker"
              Write-Host "Solution: $($solution.Name)"
              Write-Host "=========================================="

              $solutionPath = Join-Path $solutionRoot $solution.Name
              $zipPath = Join-Path $env:GITHUB_WORKSPACE "$($solution.Name).zip"

              # ------------------------------------------------
              # Validate solution folder
              # ------------------------------------------------

              if (-not (Test-Path $solutionPath)) {
                  Write-Error "Solution folder not found: $solutionPath"
                  $failed = $true
                  continue
              }

              # ------------------------------------------------
              # Pack solution
              # ------------------------------------------------

              Write-Host "Packing solution..."

              pac solution pack `
                --zipfile $zipPath `
                --folder $solutionPath

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to pack $($solution.Name)."
                  $failed = $true
                  continue
              }

              Write-Host "Solution package created: $zipPath"

              # ------------------------------------------------
              # Run Solution Checker
              # ------------------------------------------------

              Write-Host "Running Power Platform Solution Checker..."

              pac solution check `
                --path $zipPath

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "$($solution.Name) Solution Checker FAILED."
                  $failed = $true
              }
              else {
                  Write-Host "$($solution.Name) Solution Checker PASSED."
              }
          }

          # ----------------------------------------------------
          # Final Solution Checker Result
          # ----------------------------------------------------

          if ($failed) {
              Write-Error "One or more solutions failed Solution Checker."
              exit 1
          }

          Write-Host ""
          Write-Host "All changed solutions passed Solution Checker."
          exit 0


  # ==========================================================
  # 3. C# Plugin CodeQL Scan
  # ==========================================================
  csharp-codeql:
    name: C# CodeQL Scan
    needs: detect-changes

    if: needs.detect-changes.outputs.plugin == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Initialize CodeQL
      # ------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp


      # ------------------------------------------------------
      # Build Plugin
      # ------------------------------------------------------
      - name: Build C# Plugin
        shell: pwsh
        run: |

          Write-Host "D365 Plugin changes detected."

          $pluginPath = Join-Path $env:GITHUB_WORKSPACE "D365Plugin"

          if (-not (Test-Path $pluginPath)) {
              Write-Error "D365Plugin folder not found."
              exit 1
          }

          Set-Location $pluginPath

          # Find solution file
          $solution = Get-ChildItem `
              -Path $pluginPath `
              -Filter "*.sln" `
              -Recurse |
              Select-Object -First 1

          if ($null -ne $solution) {

              Write-Host "Solution found:"
              Write-Host $solution.FullName

              dotnet restore $solution.FullName

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "NuGet restore failed."
                  exit 1
              }

              dotnet build `
                  $solution.FullName `
                  --configuration Release `
                  --no-restore

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "C# Plugin build failed."
                  exit 1
              }

          }
          else {

              # Find project file
              $project = Get-ChildItem `
                  -Path $pluginPath `
                  -Filter "*.csproj" `
                  -Recurse |
                  Select-Object -First 1

              if ($null -eq $project) {
                  Write-Error "No .sln or .csproj file found in D365Plugin."
                  exit 1
              }

              Write-Host "Project found:"
              Write-Host $project.FullName

              dotnet restore $project.FullName

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "NuGet restore failed."
                  exit 1
              }

              dotnet build `
                  $project.FullName `
                  --configuration Release `
                  --no-restore

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "C# Plugin build failed."
                  exit 1
              }
          }


      # ------------------------------------------------------
      # CodeQL Analysis
      # ------------------------------------------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ==========================================================
  # 4. MasterData Only - SUCCESS
  # ==========================================================
  masterdata-success:
    name: MasterData - No Scan Required
    needs: detect-changes

    if: |
      needs.detect-changes.outputs.masterdata == 'true' &&
      needs.detect-changes.outputs.solution1 != 'true' &&
      needs.detect-changes.outputs.solution2 != 'true' &&
      needs.detect-changes.outputs.solution3 != 'true' &&
      needs.detect-changes.outputs.solution4 != 'true' &&
      needs.detect-changes.outputs.solution5 != 'true' &&
      needs.detect-changes.outputs.plugin != 'true'

    runs-on: ubuntu-latest

    steps:

      - name: MasterData Changes
        shell: pwsh
        run: |

          Write-Host "=========================================="
          Write-Host "Only MasterData changes detected."
          Write-Host "No scanning is required."
          Write-Host "Pipeline will be marked SUCCESS."
          Write-Host "=========================================="

          exit 0


  # ==========================================================
  # 5. Final Required Check
  # ==========================================================
  scanning-result:
    name: Code Scanning Pipeline

    needs:
      - detect-changes
      - solution-checker
      - csharp-codeql
      - masterdata-success

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Evaluate Final Result
        shell: pwsh
        run: |

          Write-Host "=========================================="
          Write-Host "D365 CODE SCANNING PIPELINE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Solution Checker : ${{ needs.solution-checker.result }}"
          Write-Host "C# CodeQL        : ${{ needs.csharp-codeql.result }}"
          Write-Host "MasterData       : ${{ needs.masterdata-success.result }}"
          Write-Host ""

          # --------------------------------------------------
          # Solution Checker
          # --------------------------------------------------

          if ("${{ needs.solution-checker.result }}" -eq "failure") {
              Write-Error "Solution Checker FAILED."
              exit 1
          }

          # --------------------------------------------------
          # CodeQL
          # --------------------------------------------------

          if ("${{ needs.csharp-codeql.result }}" -eq "failure") {
              Write-Error "C# CodeQL Scan FAILED."
              exit 1
          }

          # --------------------------------------------------
          # Unexpected Error
          # --------------------------------------------------

          if ("${{ needs.detect-changes.result }}" -eq "failure") {
              Write-Error "Change detection failed."
              exit 1
          }

          Write-Host "=========================================="
          Write-Host "All applicable scans completed successfully."
          Write-Host "Code Scanning Pipeline = SUCCESS"
          Write-Host "=========================================="

          exit 0
