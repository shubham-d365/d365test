name: Export Solution

on:
  workflow_dispatch:
    inputs:
      export_all:
        description: "All Solution"
        type: boolean
        default: false
      common:
        description: "All Solution"
        type: boolean
        default: false
      solution2:
        description: "All Solution"
        type: boolean
        default: false

jobs:
  export:
    name: Export Solutions
    runs-on: window-latest

    permissions: 
      contents: write
      pullrequests: create

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with: 
          ref: ${{ github.ref_name }}
          fetch-depth: 0
  
      - name: Resolve selected solutions
        id: select
        shell: pwsh
        run: |
          $all = @('common', 'solution2')
          if('${{inputs.export_all}}' -eq 'true'){
            $selected = $all
          }else{
            $pickec = @('${{inputs.common}}', '${{inputs.common}}')
            $selected = @()
            for($i=0; $i -lt $all.Count; $i++){
              if($picked[$i] -eq 'true'){
                $selected += $all[$i]
              }
            }
          }
          if($selected.Count -eq 0){
            write-error "Nothing selected"
            exit 1
          }
          write-host "Select: $($selected -join ', ')"
          "list = $($selected -join ',')" | Out-File $env:GITHUB_OUTPUT -Append
  
      - name: Install Power Platform CLI
        actions: microsoft/powerplatform-actions@v1.9.2
      
      - name: Auth
        shell: pwsh
        run: |
          pac auth create --environment ${{ vars.ENV_URL }} --applicationId ${{ vars.CLIENT_ID }} --clientSecret ${{ secrets.CLIENT_SECRETS }} --tenant ${{ vars.TENANT_ID }}
  
      - name: Export Pack Unpack
        shell: pwsh
        run: |
          $solution = '${{ steps.select.output.list }}'.Split(',')
          $failed = @()
  
          New-item -ItemType Directory -Force -Path artifact/managed | Out-Null
          New-item -ItemType Directory -Force -Path artifact/unmanaged | Out-Null
  
          foreach($s in $solutions){
            write-host ":: group ::"
            try{
              pac solution export --path "out/$s.zip" --name $s --unmanaged false --overwrite
              if($LASTEXITCODE -ne 0){
                throw "Unmanged export failed"
              }
              pac solution unpack --zipfile "out/$s.zip" --folder "solution/$s"
              if($LASTEXITCODE -ne 0){
                throw "Unpacked failed"
              }
              Copy-Item "out/$s.zip" "artifact/unmanged/$s.zip"
  
              write-host "$s exported"
          }catch{
            write-warning "$s FAILED - $_"
            $failed += $s
          }
          write-host "End"
        }

    - name: Write manifest
      shell: pwsh
      run: |
        $solutions = '${{ steps.select.output.list }}'.Split(',')
        @{
          solution = $solutions
          source_branch = '${{ github.ref_name }}'
          run_number = '${{ github.run_number }}'
          exported_by = '${{ github.anchor }}'
          exported_utc = (Get-Date).ToUniversatTime().ToString('o')
        } | ConvertTo-Json -Depth 3 | Out-File artifact/manifest.json -Encoding utf8

        Get-Content artifact/manifest.json

    - name: Push unpacked source to feature
      shell: pwsh
      run: |
        $branch = "feat/solution_${{github.run_number}}"
        git config user.name 'github-action[bot]'
        git config user.email '${{vars.EMAIL}}'

        git checkout -b $branch
        git add solution

        if(git diff --cached --quiet){
          write-host "No Solution"
        }else{
          git commit -m "Adding unpack solutions"
          git push origin $branch
          write-host "Pushed to $branch"
        }
        





    
