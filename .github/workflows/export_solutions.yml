name: Export Solution

on:
  workflow_dispatch:
    inputs:
      export_all:
        description: "All Solution"
        type: boolean
        default: false
      CRMLearning:
        description: "CRM Solution"
        type: boolean
        default: false
      solution2:
        description: "Solution 2"
        type: boolean
        default: false

jobs:
  export:
    name: Export Solutions
    runs-on: windows-latest

    permissions: 
      contents: write
      pull-requests: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with: 
          ref: ${{ github.ref_name }}
          fetch-depth: 0
  
      - name: Resolve selected solutions
        id: select
        shell: pwsh
        run: |
          $all = @('CRMLearning', 'solution2')
          if('${{inputs.export_all}}' -eq 'true'){
            $selected = $all
          }else{
            $picked = @('${{inputs.CRMLearning}}', '${{inputs.solution2}}')
            $selected = @()
            for($i=0; $i -lt $all.Count; $i++){
              if($picked[$i] -eq 'true'){
                $selected += $all[$i]
              }
            }
          }
          if($selected.Count -eq 0){
            write-error "Nothing selected"
            exit 1
          }
          write-host "Select: $($selected -join ', ')"
          "list=$($selected -join ',')" >> $env:GITHUB_OUTPUT
  
      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true

            
      - name: Auth
        shell: pwsh
        run: |
          pac auth create --environment ${{ vars.ENV_URL }} --applicationId ${{ vars.CLIENT_ID }} --clientSecret ${{ secrets.CLIENT_SECRETS }} --tenant ${{ vars.TENANT_ID }}
  

      - name: Export Pack Unpack
        shell: pwsh
        run: |
          $solutions = '${{ steps.select.outputs.list }}'.Split(',')
          write-host "Solutions: $($solutions -join ', ')"
          $failed = @()
  
          New-item -ItemType Directory -Force -Path artifact/managed | Out-Null
          New-item -ItemType Directory -Force -Path artifact/unmanaged | Out-Null
  
          foreach($s in $solutions){
            write-host ":: group ::"
            try{
              pac solution export --path "out/$s.zip" --name $s --managed false 
              if($LASTEXITCODE -ne 0){
                throw "Unmanged export failed"
              }
              pac solution unpack --zipfile "out/$s.zip" --folder "solution/$s"
              if($LASTEXITCODE -ne 0){
                throw "Unpacked failed"
              }
              
              $solutionXml = "solution/$s/Other/Solution.xml"
              if (Test-Path $solutionXml) {
                  Write-Host "Updating managed value in $solutionXml"
                  [xml]$xml = Get-Content $solutionXml
                  $managedNode = $xml.SelectSingleNode("//Managed")
                  if ($null -ne $managedNode) {
                      Write-Host "Old value: $($managedNode.InnerText)"
                      $managedNode.InnerText = "Both"
                      $xml.Save($solutionXml)
                      Write-Host "New value: $($managedNode.InnerText)"
                  }
                  else {
                      Write-Warning "managed node not found in $solutionXml"
                  }
              }
              else {
                  Write-Warning "$solutionXml does not exist"
              }

              pac solution pack --folder "solution/$s" --zipfile "artifact/managed/$s.zip" --packagetype Managed
              
              if($LASTEXITCODE -ne 0) {
                  throw "Solution pack failed"
              }
              
              Write-Host "$s managed solution packed successfully"
              
              Copy-Item "out/$s.zip" "artifact/unmanged/"
  
              write-host "$s exported"
              }catch{
                write-warning "$s FAILED - $_"
                $failed += $s
              }
              write-host "End"
            }

      - name: Write manifest
        shell: pwsh
        run: |
          $solutions = '${{ steps.select.outputs.list }}'.Split(',')
          @{
            solution = $solutions
            source_branch = '${{ github.ref_name }}'
            run_number = '${{ github.run_number }}'
            exported_by = '${{ github.actor }}'
            exported_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 3 | Out-File artifact/manifest.json -Encoding utf8
  
          Get-Content artifact/manifest.json

      - name: Push unpacked source to feature
        shell: pwsh
        run: |
          $branch = "feat/solution_${{github.run_number}}"
          git config user.name 'github-action[bot]'
          git config user.email '${{vars.EMAIL}}'
  
          git checkout -b $branch
          git add solution
  
          if(git diff --cached --quiet){
            write-host "No Solution"
          }else{
            git commit -m "Adding unpack solutions"
            git push origin $branch
            write-host "Pushed to $branch"
          }

      - name: Create Pull Request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseBranch = "${{ github.ref_name }}"
          $featureBranch = "feat/solution_${{ github.run_number }}"
          gh pr create --base $baseBranch --head $featureBranch --title "Update solution - Run ${{ github.run_number }}" --body "Adding unpack solutions"

      - name: Upload solution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exported-solutions-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error





    
