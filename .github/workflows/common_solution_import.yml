name: Import Common

on:
  workflow_call:
    inputs:
      stage:
        description: "BUID | TEST"
        required: true
        type: string

      solution:
        description: "Comma separated solution names"
        required: true
        type: string

      source_run_id:
        description: "Export workflow run ID"
        required: true
        type: string


jobs:
  import:
    runs-on: windows-latest

    environment: ${{ inputs.stage }}

    steps:

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true


      - name: Download export artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: exported-solutions-*
          merge-multiple: true
          path: artifact


      - name: Show artifact contents
        shell: pwsh
        run: |
          Get-ChildItem artifact -Recurse |
            Select-Object FullName


      - name: Auth
        shell: pwsh
        run: |
          pac auth create `
            --environment "${{ vars.ENV_URL }}" `
            --applicationId "${{ vars.CLIENT_ID }}" `
            --clientSecret "${{ secrets.CLIENT_SECRETS }}" `
            --tenant "${{ vars.TENANT_ID }}"


      - name: Prepare solution sequence
        id: sequence
        shell: pwsh
        run: |
          $requested = '${{ inputs.solution }}'.Split(',') |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -ne '' }

          $sequence = @(
            "solution1",
            "solution2",
            "solution3",
            "solution4",
            "solution5",
            "solution6",
            "solution7",
            "solution8",
            "solution9"
          )

          $selected = @(
            $sequence |
            Where-Object { $_ -in $requested }
          )

          if ($selected.Count -eq 0) {
            Write-Error "No valid solutions selected."
            exit 1
          }

          Write-Host "Import sequence: $($selected -join ', ')"

          "list=$($selected -join ',')" |
            Out-File $env:GITHUB_OUTPUT -Append


      - name: Import solutions
        shell: pwsh
        run: |
          $solutions = '${{ steps.sequence.outputs.list }}'.Split(',')

          foreach ($s in $solutions) {

            $s = $s.Trim()

            Write-Host ""
            Write-Host "=========================================="
            Write-Host "Importing: $s"
            Write-Host "=========================================="

            $zip = "artifact/managed/$s.zip"

            if (-not (Test-Path $zip)) {
              Write-Error "Managed solution ZIP not found: $zip"
              exit 1
            }

            Write-Host "Importing $s..."

            pac solution import `
              --path "$zip" `
              --force-overwrite `
              --activate-plugins `
              --async

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Solution import failed: $s"
              exit 1
            }

            Write-Host "$s imported successfully."
          }


      - name: Publish solutions
        shell: pwsh
        run: |

            pac solution publish 
