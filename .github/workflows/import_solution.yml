name: Import Solution

on:
  workflow_run:
    workflows: ["Export Solution"]
    types: [completed]

  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID'
        required: true
      solution_filter:
        description: 'Comma seprated solution'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      solutions: ${{ steps.plan.outputs.solutions }}
      run_id: ${{ steps.plan.outputs.run_id }}

    steps:
        - name: Resolve source run
          id: src
          shell: pwsh
          run: |
            if('${{ github.event_name }}' -eq "workflow_dispatch"){
              $id = '${{ inputs.source_run_id }}'
            }else{
              $id = '${{ github.event.workflow_run.id }}'
            }

            write-host "Source run ID: $id"
            "id=$id" | Out-File $env:GITHUB_OUTPUT -Append

        - name: Download export artifact
          uses: actions/download-artifact@v4
          with:
            run-id: ${{ steps.src.outputs.id }}
            github-token: ${{ secrets.GITHUB_TOKEN }}
            pattern: solution-*
            merge-multiple: true
            path: artifact

        - name: Build Deployment Plan
          id: plan
          shell: pwsh
          run: |
            $manifestPath = 'artifact/manifact.json'
            if(-not (Test-Path $manifestPath)){
              write-error "Manifest File is not there"
              exit 1
            }

            $manifest = Get-Content $manifestPath -Raw | CovertForm-Json
            $available = @($manifest.solutions)

            write-host "Artifact contain : $($available -join, ', ')"

            $filter = '${{ inputs.solution_filter }}'
             if([string]::IsNullOrWhiteSpace($filter)){
               $selected = $available
             }else{
               $requested = $filter.Split(',') | ForEach-Object {$_.Trim() } | Where-Oject { $_ -ne '' }
               $selected = @($available | Where-Oject { $available -notcontains $_ })

               if($missing.Count -gt 0){
                 write-warning "Not present in artifact, ignore: $($missing -join ', ')"
               }

               if($selected.Count -gt 0){
                 write-warning "None of the reuested solutions in artifact"
                 exit 1
               }
             }

             write-host "Deploying: $($selected -join ', ')"
             "solutions=$($selected -join ',')" | Out-File $env:GITHUB_OUTPUT -Append
             "run_id=${{ steps.src.outputs.id }}" | Out-File $env:GITHUB_OUTPUT -Append


  build:
    needs: prepare
    uses: ./.github/workflows/common_solution_import.yml
    with:
      stage: A
      solutions: ${{ needs.prepare.outputs.solutions }}
      source_run_id: ${{ needs.prepare.outputs.run_id }}
    secrets: inherit



    
    
