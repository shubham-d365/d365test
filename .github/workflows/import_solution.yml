name: Import Solution

on:
  workflow_run:
    workflows: ["Export Solution"]
    types: [completed]

  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID"
        required: true
        type: string

      solution_filter:
        description: "Comma separated solution"
        required: false
        default: ""
        type: string

jobs:
  prepare:
    runs-on: windows-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      solutions: ${{ steps.plan.outputs.solutions }}
      run_id: ${{ steps.plan.outputs.run_id }}

    steps:
      - name: Resolve source run
        id: src
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $id = '${{ inputs.source_run_id }}'
          }
          else {
            $id = '${{ github.event.workflow_run.id }}'
          }

          Write-Host "Source Run ID: $id"
          "id=$id" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Download export artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.src.outputs.id }}
          github-token: ${{ github.token }}
          pattern: exported-solutions-*
          merge-multiple: true
          path: artifact

      - name: Show artifact contents
        shell: pwsh
        run: |
          if (Test-Path "artifact") {
            Get-ChildItem "artifact" -Recurse |
              Select-Object FullName
          }
          else {
            Write-Error "Artifact folder not found."
            exit 1
          }

      - name: Build Deployment Plan
        id: plan
        shell: pwsh
        run: |
          $manifestPath = "artifact/manifest.json"

          if (-not (Test-Path $manifestPath)) {
            Write-Error "Manifest file not found: $manifestPath"
            exit 1
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $available = @($manifest.solution)

          Write-Host "Available solutions: $($available -join ', ')"

          $filter = '${{ inputs.solution_filter }}'

          if ([string]::IsNullOrWhiteSpace($filter)) {
            $selected = @($available)
          }
          else {
            $requested = @(
              $filter.Split(',') |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -ne '' }
            )

            $missing = @(
              $requested |
              Where-Object { $_ -notin $available }
            )

            $selected = @(
              $requested |
              Where-Object { $_ -in $available }
            )

            if ($missing.Count -gt 0) {
              Write-Warning "Not present in artifact: $($missing -join ', ')"
            }

            if ($selected.Count -eq 0) {
              Write-Error "None of the requested solutions are available."
              exit 1
            }
          }

          Write-Host "Deploying: $($selected -join ', ')"

          "solutions=$($selected -join ',')" | Out-File $env:GITHUB_OUTPUT -Append
          "run_id=${{ steps.src.outputs.id }}" | Out-File $env:GITHUB_OUTPUT -Append

  build:
    needs: prepare

    uses: ./.github/workflows/common_solution_import.yml

    with:
      stage: 'BUILD'
      solution: ${{ needs.prepare.outputs.solutions }}
      source_run_id: ${{ needs.prepare.outputs.run_id }}

    secrets: inherit

  test:
    needs: prepare

    uses: ./.github/workflows/common_solution_import.yml

    with:
      stage: 'TEST'
      solution: ${{ needs.prepare.outputs.solutions }}
      source_run_id: ${{ needs.prepare.outputs.run_id }}

    secrets: inherit
